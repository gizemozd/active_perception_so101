[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "active-perception-arms"
version = "0.2.0"
description = "Controlled two-arm SO-101 active-vision experiments with MjLab and MuJoCo Warp"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mjlab==1.4.0",
  "mujoco==3.9.0",
  "rsl-rl-lib==5.2.0",
  "torch==2.10.0",
  "warp-lang==1.13.0",
  "numpy>=2.2",
  "pillow>=11",
  "imageio[ffmpeg]>=2.37",
]

[project.scripts]
arms-train = "active_perception_arms.train:main"
arms-sanity = "active_perception_arms.sanity:main"
arms-benchmark = "active_perception_arms.benchmark:main"
arms-evaluate = "active_perception_arms.evaluate:main"

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.14"]

[tool.uv]
override-dependencies = ["mujoco==3.9.0"]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
warp-lang = { index = "nvidia", marker = "sys_platform != 'darwin'" }
mujoco-warp = { git = "https://github.com/google-deepmind/mujoco_warp", rev = "88b55fc2696960b927bc12584994bb8412b36558" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["gpu: requires CUDA and the Warp camera renderer", "render: creates native MuJoCo offscreen images"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
